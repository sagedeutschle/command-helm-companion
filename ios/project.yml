name: CommandHelmRemote
options:
  postGenCommand: |
    mkdir -p CommandHelmRemote.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
    cp Package.resolved CommandHelmRemote.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
  bundleIdPrefix: com.sagedeutschle
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: ZW9HBTRLRT
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '1.0.1'
    CURRENT_PROJECT_VERSION: '6'
packages:
  SwiftTerm:
    path: Vendor/SwiftTerm
targets:
  CommandHelmRemote:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    dependencies:
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sagedeutschle.commandhelm.remote
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Command Helm
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.sagedeutschle.commandhelm.remote
            CFBundleURLSchemes: [helmremote]
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Connect to your private Command Helm bridge to send tasks, read reports, view project updates, answer questions and use interactive terminals on your computers.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortraitUpsideDown]
        ITSAppUsesNonExemptEncryption: false
  CommandHelmRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: TestSupport
        optional: true
    dependencies: [{target: CommandHelmRemote}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  CommandHelmRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
      - path: TestSupport
        optional: true
    dependencies: [{target: CommandHelmRemote}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CommandHelmRemote:
    build:
      targets:
        CommandHelmRemote: all
    test:
      targets: [CommandHelmRemoteTests, CommandHelmRemoteUITests]
